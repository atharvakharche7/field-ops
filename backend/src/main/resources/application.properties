spring.application.name=fieldops-api
# Render tells the app which port to use through PORT; locally it's 8080.
server.port=${PORT:8080}

# Local secrets (DB_PASSWORD, JWT_SECRET) can live in backend/.env, which is git-ignored.
# Real environment variables win over the file.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL has no "create database if missing" option: run CREATE DATABASE fieldops; once.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fieldops}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
# Small pool: Supabase's free tier allows only a few connections.
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-of-32-plus-chars}
app.jwt.expiration-ms=86400000
# The login cookie's Secure flag (HTTPS only). false for local http, true in production.
app.cookie.secure=${COOKIE_SECURE:false}
# The website's own address. Comma-separated if there's more than one.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Where photos go: "local" (the uploads/ folder) or "supabase" (Supabase Storage).
app.storage.type=${STORAGE_TYPE:local}
app.upload-dir=uploads
app.supabase.url=${SUPABASE_URL:}
app.supabase.service-key=${SUPABASE_SERVICE_KEY:}
app.supabase.bucket=attachments
